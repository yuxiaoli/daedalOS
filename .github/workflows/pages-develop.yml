name: Deploy develop to Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-develop
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: "0"
      NODE_OPTIONS: --openssl-legacy-provider
      BASE_PATH: /daedalOS
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out develop
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run unit tests
        run: yarn test --runInBand
      - name: Build static export
        run: yarn build
      - name: Verify static export
        run: |
          test -f out/index.html
          test -d out/_next
          node <<'NODE'
          const assert = require("node:assert/strict");
          const { readFileSync } = require("node:fs");
          const html = readFileSync("out/index.html", "utf8");
          const match = html.match(/<script[^>]*id=["']?__NEXT_DATA__["']?[^>]*>([\s\S]*?)<\/script>/);
          assert(match, "Next bootstrap metadata must be retained");
          const data = JSON.parse(match[1]);
          assert.equal(data.assetPrefix.replace(/\/$/, ""), "/daedalOS");
          assert(data.buildId && data.nextExport, "Next export metadata must be retained");
          console.log("Verified dynamic chunks retain /daedalOS asset prefix");
          NODE
          touch out/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Fetch verification script from exact commit
        run: curl --fail --retry 3 --output "$RUNNER_TEMP/verifyPages.cjs" "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/verifyPages.cjs"
      - name: Set up Node.js for verification
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install browser driver
        run: npm install --prefix "$RUNNER_TEMP/pages-browser" --no-save --ignore-scripts playwright@1.63.0
      - name: Verify published assets and browser fallback
        env:
          PAGES_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          export NODE_PATH="$RUNNER_TEMP/pages-browser/node_modules"
          node "$RUNNER_TEMP/verifyPages.cjs"
